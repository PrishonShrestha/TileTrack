<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · TileTrack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1414;
      color: #f0fdf4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #12201e;
      border: 1px solid #1e3a35;
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      width: 100%;
      background: #10b981;
      color: #061614;
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #34d399; }
    .links {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .links a {
      color: #6ee7b7;
      font-size: 0.8rem;
      text-decoration: underline;
      padding: 0.25rem 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📐</div>
    <h1>You are offline</h1>
    <p>TileTrack calculators work completely offline. You can continue calculating floor, wall, kitchen, and bathroom projects without an internet connection.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="links">
      <a href="/calculator/floor">Floor Calculator</a>
      <a href="/calculator/wall">Wall Calculator</a>
      <a href="/calculator/kitchen">Kitchen Calculator</a>
      <a href="/calculator/bathroom">Bathroom Calculator</a>
    </div>
  </div>
</body>
</html>
